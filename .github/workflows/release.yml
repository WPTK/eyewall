name: Release

# Runs when a v* tag is pushed. The tag, __version__ and the CHANGELOG.md heading must all name the same version.
# It builds the wheel and source distribution, the five standalone binaries (binaries.yml; the Linux and macOS ones as
# tar.gz archives so they keep the executable bit), hashes everything into
# SHA256SUMS and publishes one GitHub release carrying all of it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  python:
    name: Wheel and source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check that tag, version and changelog agree, and extract the release notes
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/eyewall/__init__.py)
          tag="${GITHUB_REF_NAME#v}"
          [ "$version" = "$tag" ] || { echo "tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1; }
          python - "$version" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[{re.escape(version)}\] - [^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          body = match.group(1) if match else ""
          body = "\n".join(line for line in body.splitlines() if not re.match(r"^\[[^\]]+\]: ", line)).strip()
          if not body:
              sys.exit(f"CHANGELOG.md has no section, or an empty one, for {version}")
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY
      - run: python -m pip install build
      - run: python -m build
      - name: The wheel installs and passes its self-test in a clean environment
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          /tmp/wheel-check/bin/eyewall --selftest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  binaries:
    name: Binaries
    uses: ./.github/workflows/binaries.yml

  publish:
    name: Publish the release
    needs: [python, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-dist
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Hash everything that will ship
        working-directory: release
        run: |
          find . -mindepth 1 -type d | grep . && { echo "unexpected directory in release/"; exit 1; }
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          # the wheel, the sdist, the exe and the four tar.gz archives, and nothing else
          [ "$(wc -l < SHA256SUMS)" -eq 7 ] || { echo "expected 7 files to ship"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Draft first, upload, then publish, so nobody sees a release without its files. Safe to re-run.
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes-file notes/release-notes.md
          gh release upload "$TAG" release/* --clobber || { echo "upload failed; the draft release is left in place"; exit 1; }
          gh release edit "$TAG" --draft=false

  # Download what was PUBLISHED (not the build artifacts), check it against the published SHA256SUMS, and run it. Catches
  # an upload that truncated or swapped a file, and a release whose asset does not start on a clean machine.
  verify:
    name: Verify published ${{ matrix.name }}
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-x86_64, os: windows-latest, asset: eyewall-windows-x86_64.exe}
          - {name: linux-x86_64, os: ubuntu-latest, asset: eyewall-linux-x86_64.tar.gz}
          - {name: linux-arm64, os: ubuntu-24.04-arm, asset: eyewall-linux-arm64.tar.gz}
          - {name: macos-arm64, os: macos-latest, asset: eyewall-macos-arm64.tar.gz}
          - {name: macos-x86_64, os: macos-15-intel, asset: eyewall-macos-x86_64.tar.gz}
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download the published asset and SHA256SUMS
        shell: bash
        run: |
          mkdir verify && cd verify
          gh release download "$TAG" --pattern "$ASSET" --pattern SHA256SUMS
          ls -la
      - name: Check the asset against the published SHA256SUMS
        shell: bash
        working-directory: verify
        run: |
          python - "$ASSET" <<'PY'
          import hashlib
          import pathlib
          import sys

          asset = sys.argv[1]
          sums = {}
          for line in pathlib.Path("SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, _, name = line.partition("  ")
              sums[name.strip().lstrip("*")] = digest
          if asset not in sums:
              sys.exit(f"{asset} is not listed in SHA256SUMS")
          actual = hashlib.sha256(pathlib.Path(asset).read_bytes()).hexdigest()
          if actual != sums[asset]:
              sys.exit(f"{asset}: published SHA256SUMS says {sums[asset]}, the download is {actual}")
          print(f"{asset}: sha256 {actual} matches")
          PY
      - name: Run the published binary
        shell: bash
        working-directory: verify
        run: |
          if [ "${ASSET%.tar.gz}" = "$ASSET" ]; then
            exe="./$ASSET"
          else
            tar -xzf "$ASSET"
            exe=./eyewall
          fi
          chmod +x "$exe"
          [ "$("$exe" --version)" = "eyewall ${TAG#v}" ] || { echo "--version does not say ${TAG#v}: a stale asset?"; exit 1; }
          "$exe" --selftest
          "$exe" --replay demo --headless --until +1h

  verify-python:
    name: Verify published wheel and sdist
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download the published wheel, sdist and SHA256SUMS
        run: |
          mkdir verify && cd verify
          # the versioned names only: the wheel and the sdist, not the eyewall-<platform> binaries
          gh release download "$TAG" --pattern 'eyewall-[0-9]*' --pattern SHA256SUMS
          ls -la
      - name: Check them against the published SHA256SUMS
        working-directory: verify
        run: |
          grep -E '\.whl$|^[0-9a-f]+  eyewall-[0-9][^ ]*\.tar\.gz$' SHA256SUMS > wanted.txt
          [ "$(wc -l < wanted.txt)" -eq 2 ] || { echo "expected the wheel and the sdist in SHA256SUMS"; cat wanted.txt; exit 1; }
          sha256sum -c wanted.txt
      - name: Install the published wheel and the published sdist, each into a clean venv, and self-test them
        working-directory: verify
        run: |
          for kind in wheel sdist; do
            python -m venv "../venv-$kind"
          done
          ../venv-wheel/bin/pip install --quiet ./*.whl
          ../venv-sdist/bin/pip install --quiet ./*.tar.gz
          for kind in wheel sdist; do
            [ "$(../venv-$kind/bin/eyewall --version)" = "eyewall ${TAG#v}" ] || { echo "$kind: --version does not say ${TAG#v}"; exit 1; }
            ../venv-$kind/bin/eyewall --selftest
          done
