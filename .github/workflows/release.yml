name: Release

# Runs when a v* tag is pushed. The tag, __version__ and the CHANGELOG.md heading must all name the same version.
# It builds the wheel and source distribution, the five standalone binaries (binaries.yml; the Linux and macOS ones as
# tar.gz archives so they keep the executable bit), hashes everything into
# SHA256SUMS and publishes one GitHub release carrying all of it, then uploads the wheel and sdist to PyPI. The file-set
# check, the release and the check of what was published are the shared workflows in WPTK/release-workflows, pinned by
# commit SHA; the binaries.yml build calls the shared build workflow the same way.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  python:
    name: Wheel and source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check that tag, version and changelog agree, and extract the release notes
        id: check
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/eyewall/__init__.py)
          tag="${GITHUB_REF_NAME#v}"
          [ "$version" = "$tag" ] || { echo "tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1; }
          python scripts/check_changelog.py
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python - "$version" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[{re.escape(version)}\] - [^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          body = match.group(1) if match else ""
          body = "\n".join(line for line in body.splitlines() if not re.match(r"^\[[^\]]+\]: ", line)).strip()
          if not body:
              sys.exit(f"CHANGELOG.md has no section, or an empty one, for {version}")
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY
      - run: python -m pip install build
      - run: python -m build
      - name: The wheel installs and passes its self-test in a clean environment
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          /tmp/wheel-check/bin/eyewall --selftest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  binaries:
    name: Binaries
    uses: ./.github/workflows/binaries.yml

  # The file set and the tag are checked before anything is published. publish repeats both checks. eyewall does not
  # attest build provenance (yet); when it does, the attest job goes here, between check and publish, in this file.
  check:
    name: Check the files and the tag
    needs: [python, binaries]
    uses: WPTK/release-workflows/.github/workflows/check-release.yml@48ad720b496558ebdf47c0a0529475b6bf3b4517 # v0.1.0
    with:
      python-artifact: python-dist
      expected-files: |
        eyewall-${{ needs.python.outputs.version }}-py3-none-any.whl
        eyewall-${{ needs.python.outputs.version }}.tar.gz
        eyewall-windows-x86_64.exe
        eyewall-linux-x86_64.tar.gz
        eyewall-linux-arm64.tar.gz
        eyewall-macos-arm64.tar.gz
        eyewall-macos-x86_64.tar.gz

  # Creates SHA256SUMS and the GitHub release (a draft, then the upload, then published). It refuses a tag that already
  # has a release, so a re-run after a partial failure needs the release deleted first.
  publish:
    name: Publish the release
    needs: [python, binaries, check]
    permissions:
      contents: write
    uses: WPTK/release-workflows/.github/workflows/publish-release.yml@48ad720b496558ebdf47c0a0529475b6bf3b4517 # v0.1.0
    with:
      python-artifact: python-dist
      notes-artifact: release-notes
      notes-file: release-notes.md
      expected-files: |
        eyewall-${{ needs.python.outputs.version }}-py3-none-any.whl
        eyewall-${{ needs.python.outputs.version }}.tar.gz
        eyewall-windows-x86_64.exe
        eyewall-linux-x86_64.tar.gz
        eyewall-linux-arm64.tar.gz
        eyewall-macos-arm64.tar.gz
        eyewall-macos-x86_64.tar.gz

  # Download what was PUBLISHED (not the build artifacts), check it against the published SHA256SUMS, and run each binary
  # on a runner of its own kind with nothing of ours installed. Catches an upload that truncated or swapped a file, and
  # a release whose asset does not start on a clean machine. There is no attestation to check.
  verify:
    name: Verify published binaries
    needs: [python, publish]
    permissions:
      contents: read
      attestations: read
    uses: WPTK/release-workflows/.github/workflows/verify-published.yml@48ad720b496558ebdf47c0a0529475b6bf3b4517 # v0.1.0
    with:
      tag: ${{ github.ref_name }}
      app: eyewall
      asset-prefix: eyewall
      verify-attestations: false
      expected-files: |
        eyewall-${{ needs.python.outputs.version }}-py3-none-any.whl
        eyewall-${{ needs.python.outputs.version }}.tar.gz
        eyewall-windows-x86_64.exe
        eyewall-linux-x86_64.tar.gz
        eyewall-linux-arm64.tar.gz
        eyewall-macos-arm64.tar.gz
        eyewall-macos-x86_64.tar.gz
      smoke-command: |
        [ "$("$BIN" --version | tr -d '\r')" = "eyewall ${{ needs.python.outputs.version }}" ] || { echo "--version does not say ${{ needs.python.outputs.version }}: a stale asset?"; exit 1; }
        "$BIN" --selftest
        "$BIN" --replay demo --headless --until +1h

  verify-python:
    name: Verify published wheel and sdist
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download the published wheel, sdist and SHA256SUMS
        run: |
          mkdir verify && cd verify
          # the versioned names only: the wheel and the sdist, not the eyewall-<platform> binaries
          gh release download "$TAG" --pattern 'eyewall-[0-9]*' --pattern SHA256SUMS
          ls -la
      - name: Check them against the published SHA256SUMS
        working-directory: verify
        run: |
          grep -E '\.whl$|^[0-9a-f]+  eyewall-[0-9][^ ]*\.tar\.gz$' SHA256SUMS > wanted.txt
          [ "$(wc -l < wanted.txt)" -eq 2 ] || { echo "expected the wheel and the sdist in SHA256SUMS"; cat wanted.txt; exit 1; }
          sha256sum -c wanted.txt
      - name: Install the published wheel and the published sdist, each into a clean venv, and self-test them
        working-directory: verify
        run: |
          for kind in wheel sdist; do
            python -m venv "../venv-$kind"
          done
          ../venv-wheel/bin/pip install --quiet ./*.whl
          ../venv-sdist/bin/pip install --quiet ./*.tar.gz
          for kind in wheel sdist; do
            [ "$(../venv-$kind/bin/eyewall --version)" = "eyewall ${TAG#v}" ] || { echo "$kind: --version does not say ${TAG#v}"; exit 1; }
            ../venv-$kind/bin/eyewall --selftest
          done

  # Uploads the wheel and sdist the python job built and tested (no rebuild) once the GitHub release is published and
  # its assets verified. PyPI cannot take a version back, so this is last. release.yml's manual fallback is publish.yml.
  publish-pypi:
    name: Publish to PyPI
    needs: [python, binaries, check, publish, verify, verify-python]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
