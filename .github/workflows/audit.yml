name: Dependency audit

# Weekly check of the packages a user installs (the runtime dependencies as they resolve today) against the Python
# Packaging Advisory Database. It is not part of the pull request gate on purpose: a new advisory or an outage of the
# advisory service says nothing about a given change, and must not turn unrelated pull requests red.
# A finding ends the run red and opens one issue (label dependency-audit), or comments on the one already open.
# pip-audit runs from its own virtual environment and is pointed at the project's, so only the project's dependencies
# are audited, not pip-audit's or the runner's.
on:
  schedule:
    - cron: "17 13 * * 1" # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: |
          python -m venv "$RUNNER_TEMP/project"
          "$RUNNER_TEMP/project/bin/python" -m pip install --quiet .
          python -m venv "$RUNNER_TEMP/tool"
          "$RUNNER_TEMP/tool/bin/python" -m pip install --quiet pip-audit==2.9.0
      - name: Audit
        id: audit
        run: |
          set +e
          "$RUNNER_TEMP/tool/bin/pip-audit" --path "$RUNNER_TEMP/project/lib/python3.12/site-packages" \
            --skip-editable 2>&1 | tee "$RUNNER_TEMP/audit.txt"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Open or update the issue
        if: steps.audit.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "pip-audit reported a problem with the runtime dependencies (or could not run)."
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/audit.txt"
            echo '```'
            echo "Run: $RUN_URL"
          } > "$RUNNER_TEMP/body.md"
          gh label create dependency-audit --color D93F0B --description "pip-audit finding" 2>/dev/null || true
          number="$(gh issue list --label dependency-audit --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --label dependency-audit --title "Dependency audit: pip-audit reported a problem" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
      - name: Fail the run when the audit did not pass
        if: steps.audit.outputs.code != '0'
        run: exit 1
