name: Publish to PyPI

# Run by hand from the Actions tab. Builds the sdist and wheel at `ref`, checks them, and uploads to PyPI with trusted
# publishing (OIDC): the `pypi` environment is the only thing that can publish, and no token is stored anywhere.
# Releases normally publish from release.yml on a v* tag; this is the manual path (a re-run, or a tag that predates it).
# PyPI refuses to overwrite an uploaded version; nothing here deletes or replaces a release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build and publish (for example v0.10.0)
        type: string
        default: main

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build twine
          python -m build

      - name: Check the metadata
        run: python -m twine check dist/*

      - name: The built wheel version matches the source and the requested ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          python - <<'PY'
          import glob
          import os
          import re
          import zipfile
          from pathlib import Path

          ref = os.environ["REF"]
          source = re.search(r'^__version__ = "([^"]+)"', Path("src/eyewall/__init__.py").read_text("utf-8"), re.M).group(1)
          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              meta = z.read(name).decode()
          built = next(line.split(": ", 1)[1] for line in meta.splitlines() if line.startswith("Version: "))
          assert built == source, f"wheel version {built} != __version__ {source}"
          tag = re.fullmatch(r"v(\d+\.\d+\.\d+)", ref)
          if tag:
              assert built == tag.group(1), f"ref {ref} names {tag.group(1)} but the wheel is {built}"
          else:
              assert re.fullmatch(r"\d+\.\d+\.\d+", built), f"ref {ref} builds {built}, not a clean release version"
          print("wheel version", built, "at", ref)
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
