name: Binaries

# Builds the one-file binary on each platform with PyInstaller and runs it. Called by release.yml on a tag; also runs by
# hand (workflow_dispatch) and on pull requests that touch the build, so a broken spec shows up before a release rather
# than during one. Nothing here publishes anything.
#
# The matrix, the smoke test, the glibc check and the naming live in WPTK/release-workflows (build-binaries.yml); this
# file only says how eyewall installs, builds and runs. Dependencies install with the pins in
# scripts/binary-constraints.txt (regenerate it with scripts/update_constraints.py). Artifacts lose file modes, so the
# Linux and macOS binaries are tar.gz archives that keep the executable bit; the archive holds one file named `eyewall`.
# Windows ships the bare exe. The asset names carry no version.
#
#   eyewall-windows-x86_64.exe      windows-latest
#   eyewall-linux-x86_64.tar.gz     ubuntu-latest, built inside python:3.12-bullseye so the glibc floor is 2.31
#   eyewall-linux-arm64.tar.gz      ubuntu-24.04-arm, same container
#   eyewall-macos-arm64.tar.gz      macos-latest (Apple silicon)
#   eyewall-macos-x86_64.tar.gz     macos-15-intel (GitHub's last Intel image)

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - eyewall.spec
      - scripts/build_exe.ps1
      - scripts/binary-constraints.txt
      - scripts/pyinstaller-version.txt
      - pyproject.toml
      - src/eyewall/**
      - tests/fixtures/replay/erin2025/**
      - .github/workflows/binaries.yml

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The two Linux builds run inside python:3.12-bullseye, pinned by digest (multi-arch index, checked 2026-10-31), so the
  # binaries need only glibc 2.31. Bullseye is past Debian's LTS window, kept on purpose for that floor; move the pin
  # deliberately, and update the glibc note in docs/development.md with it. macos-x86_64 is GitHub's last Intel image.
  # tzdata is a Windows-only dependency of the package; a standalone binary may land on a minimal system with no zone
  # files, so every binary bundles its own.
  binary:
    name: Binary
    uses: WPTK/release-workflows/.github/workflows/build-binaries.yml@48ad720b496558ebdf47c0a0529475b6bf3b4517 # v0.1.0
    with:
      app: eyewall
      asset-prefix: eyewall
      linux-container: python:3.12-bullseye@sha256:7cc929040c5e8cf6036c5099d62a83708427c131fb7a7c965b5ba51e995eea1c
      install-command: python -m pip install -c scripts/binary-constraints.txt -e . tzdata textual-image "pyinstaller==$(cat scripts/pyinstaller-version.txt)"
      build-command: python -m PyInstaller --noconfirm --clean --workpath .pyi-build eyewall.spec
      smoke-command: |
        "$BIN" --version
        "$BIN" --selftest || { echo "--selftest failed: the frozen app is missing something"; exit 1; }
        "$BIN" --replay demo --headless --until +1h
