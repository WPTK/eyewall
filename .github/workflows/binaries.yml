name: Binaries

# Builds the one-file binary on each platform with PyInstaller and runs `--selftest` against it. Called by release.yml on a
# tag; also runs by hand (workflow_dispatch) and on pull requests that touch the build, so a broken spec shows up before
# a release rather than during one. Nothing here publishes anything.
#
#   eyewall-windows-x86_64.exe   windows-latest
#   eyewall-linux-x86_64         ubuntu-latest, built inside python:3.12-bullseye so the glibc floor is 2.31
#   eyewall-linux-arm64          ubuntu-24.04-arm, same container
#   eyewall-macos-arm64          macos-latest (Apple silicon)
#   eyewall-macos-x86_64         macos-15-intel (GitHub's last Intel image)

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - eyewall.spec
      - scripts/build_exe.ps1
      - pyproject.toml
      - src/eyewall/cli.py
      - src/eyewall/__main__.py
      - .github/workflows/binaries.yml

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  binary:
    name: Binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Empty for the jobs that run straight on the runner; GitHub treats '' as "no container".
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            ext: .exe
          - name: linux-x86_64
            os: ubuntu-latest
            container: python:3.12-bullseye
          - name: linux-arm64
            os: ubuntu-24.04-arm
            container: python:3.12-bullseye
          - name: macos-arm64
            os: macos-latest
          - name: macos-x86_64
            os: macos-15-intel
    env:
      BINARY: eyewall-${{ matrix.name }}${{ matrix.ext }}
      BUILT: dist/eyewall${{ matrix.ext }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.container == ''
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # tzdata is a Windows-only dependency of the package; a standalone binary may land on a minimal system with no zone
      # files, so every binary bundles its own.
      - name: Install
        shell: bash
        run: python -m pip install -e . tzdata "pyinstaller==$PYINSTALLER_VERSION"

      - name: Build
        shell: bash
        run: python -m PyInstaller --noconfirm --clean --workpath .pyi-build eyewall.spec

      - name: Run the binary's self-test
        shell: bash
        run: |
          ls -la "$BUILT"
          "./$BUILT" --version
          "./$BUILT" --selftest || { echo "--selftest failed: the frozen app is missing something"; exit 1; }
          "./$BUILT" --replay demo --headless --until +1h

      - name: Name the binary for its platform
        shell: bash
        run: mv "$BUILT" "dist/$BINARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.name }}
          path: dist/${{ env.BINARY }}
          if-no-files-found: error
          retention-days: 7
