[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "eyewall"
dynamic = ["version"]
description = "Track tropical cyclones, nearby buoys and tide gauges from NOAA data in your terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Bill Kane" }]
keywords = ["hurricane", "tropical cyclone", "noaa", "nhc", "ndbc", "buoy", "tui", "terminal", "textual"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "textual>=8.2,<9",
    "httpx>=0.28,<1",
    "platformdirs>=4,<5",
    "tomli-w>=1,<2",
    "pyshp>=3.1,<4",
    "pillow>=11",
    "textual-image>=0.14,<1",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "psutil>=7.2.2",
    "pytest-cov>=7.1.0",
    "pytest-textual-snapshot>=1.1",
    "respx>=0.23.1",
    "hypothesis>=6.170.13",
    "ruff>=0.17.3",
    "vulture>=2.16",
    "mypy>=2.4.1",
    "build>=1.6.1,<2",
]

[project.urls]
Homepage = "https://github.com/WPTK/eyewall"
Issues = "https://github.com/WPTK/eyewall/issues"
Changelog = "https://github.com/WPTK/eyewall/blob/main/CHANGELOG.md"

[project.scripts]
eyewall = "eyewall.cli:main"

[tool.hatch.version]
path = "src/eyewall/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eyewall"]

[tool.hatch.build.targets.wheel.force-include]
# The recorded storm that `--demo` replays ships inside the package.
"tests/fixtures/replay/erin2025" = "eyewall/demo/erin2025"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 120  # seconds per test; see docs/development.md for what happens when it passes (--timeout=0 turns it off)
addopts = "-m 'not uat'"  # the UAT suite takes minutes: run it with `pytest tests/uat -m uat`
markers = [
    "live: hits the real NOAA endpoints; skipped unless EYEWALL_LIVE=1",
    "uat: user-journey tests that drive the whole app",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    # Textual widgets declare BINDINGS/DEFAULT_CSS as plain class attributes by convention.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Long lines in tests are inline fixture payloads; wrapping them hurts readability.
"tests/**" = ["E501", "RUF001"]  # RUF001: the breadcrumb separator is a real glyph the tests assert on

[tool.mypy]
python_version = "3.12"
files = ["src/eyewall"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["shapefile", "textual_image", "textual_image.*"]
ignore_missing_imports = true
